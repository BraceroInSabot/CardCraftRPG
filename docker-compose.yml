# Full stack:      docker compose up --build        -> http://localhost:8080
# Database only:   docker compose up -d db          (for local development with runserver + vite)
name: cardcraft

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cardcraft}
      POSTGRES_USER: ${POSTGRES_USER:-cardcraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cardcraft}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      POSTGRES_DB: ${POSTGRES_DB:-cardcraft}
      POSTGRES_USER: ${POSTGRES_USER:-cardcraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cardcraft}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      SEED_DEMO: ${SEED_DEMO:-false}
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - media:/usr/share/nginx/media:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  media:
